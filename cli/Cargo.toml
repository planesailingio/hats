[package]
name = "hats"
version = "0.6.0"
description = "One laptop, many hats: dotfiles and per-shell client contexts."
readme = "../README.md"
keywords = ["dotfiles", "profiles", "cli", "chezmoi", "shell"]
categories = ["command-line-utilities"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
age = { version = "0.12.1", features = ["plugin", "armor"] }
anyhow = "1"
bitwarden-api-api = "3.0.0"
bitwarden-core = { version = "3.0.0", features = ["internal"] }
bitwarden-crypto = "3.0.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
directories = "6"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
inquire = "0.7"
minijinja = { version = "2.24.0", features = ["loader"] }
owo-colors = { version = "4", features = ["supports-colors"] }
secrecy = "0.10.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "3.2.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.26.0", features = ["v4"] }
walkdir = "2.5.0"
which = "8"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["yaml"] }
predicates = "3"
tempfile = "3"
