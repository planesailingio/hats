# Release: build archives for four Unix targets on a `v*` tag, publish them as a
# GitHub release, then update the Homebrew tap.
#
# The binary and the dotfiles content ship from ONE tag, which is what lets
# `hats update` check out exactly the tag matching the running binary. The
# `verify` job enforces that cli/Cargo.toml agrees with the tag, so the two can
# never drift.
#
# Credentials:
#   The `tap` job pushes to planesailingio/homebrew-tools, which the default
#   GITHUB_TOKEN cannot do (it is scoped to this repository only). It mints a
#   short-lived installation token for the all-ci-workflows GitHub App instead,
#   from two repository values:
#     vars.TAP_APP_ID              — the app's client ID (not secret)
#     secrets.TAP_APP_PRIVATE_KEY  — the app's private key (.pem contents)
#   Set the same way on moss and twig. Rotate by generating a new private key on
#   the app's settings page and replacing the secret in each repository.
#
# Re-running the tap alone: Actions -> Release -> Run workflow -> version.
# See docs/releasing.md for the release procedure and the dry run.
name: Release

on:
  push:
    tags: ["v*"]
  # Re-run only the tap job for a release that is already published, e.g. after
  # fixing the app credentials. verify, build and release are skipped.
  workflow_dispatch:
    inputs:
      version:
        description: "Published release to push to the tap, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The lockstep guard. A tag whose crate version disagrees would ship a binary
  # that immediately tells its user to run `hats update` forever.
  verify:
    name: version matches the tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cli/Cargo.toml version must equal the tag
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::cli/Cargo.toml is $crate but the tag is v$tag. Bump the crate, or retag."
            exit 1
          fi
          echo "crate and tag agree at v$crate"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p hats --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="hats_${version}_${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/hats"

          mkdir -p "dist/$name/bin" "dist/$name/completions"
          cp "$bin" "dist/$name/bin/hats"
          cp README.md LICENSE "dist/$name/"

          # Completions are generated by the binary itself. The host and target
          # architectures differ for one of the macOS legs, so fall back to a
          # host build rather than trying to run a foreign binary.
          if ! "$bin" completions bash > "dist/$name/completions/hats.bash" 2>/dev/null; then
            cargo build --release --locked -p hats
            bin="target/release/hats"
            "$bin" completions bash > "dist/$name/completions/hats.bash"
          fi
          "$bin" completions zsh  > "dist/$name/completions/_hats"
          "$bin" completions fish > "dist/$name/completions/hats.fish"

          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # v0.1.0-rc1 and friends are prereleases; the tap only follows finals.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256

  tap:
    name: update homebrew tap
    needs: release
    # Runs after a successful release on a final tag, or on a manual dispatch
    # (release is then skipped, so needs.release.result alone would skip us).
    if: >-
      ${{ !cancelled()
          && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
          && !contains(inputs.version || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      # Tag name on push (v0.1.0) or the dispatch input (0.1.0); the script
      # strips a leading v either way.
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Mint tap app token
        id: tap-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: planesailingio
          repositories: homebrew-tools
      - name: Explain a failed token mint
        if: ${{ failure() && steps.tap-token.outcome == 'failure' }}
        run: |
          echo "::error::Could not mint an installation token for planesailingio/homebrew-tools."
          echo "::error::'Not Found ... get-a-repository-installation' means the all-ci-workflows GitHub App is not installed on homebrew-tools (org settings -> GitHub Apps -> the app -> Configure -> add homebrew-tools). A JWT or signature error means this repository's TAP_APP_ID and TAP_APP_PRIVATE_KEY do not belong to the same app."
          exit 1
      - name: Render Formula/hats.rb and push to planesailingio/homebrew-tools
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: HATS_TAP_CONFIRM=1 scripts/update-tap.sh "${VERSION#v}"
