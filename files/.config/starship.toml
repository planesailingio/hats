# Starship prompt — managed by chezmoi. gnzh-style two-line layout (oh-my-zsh),
# Catppuccin Mocha colours, Nerd Font glyphs. Set your terminal font to a
# Nerd Font (JetBrainsMono / MesloLGS) for the icons to render.

"$schema" = 'https://starship.rs/config-schema.json'

# ╭─user@host path ‹branch status›  󱃖 profile  ☸ kube  aws  tf        dur  code ↵
# ╰─➤
format = """
╭─$username[@](cyan)$hostname $directory$git_branch$git_status${custom.profile}$kubernetes$aws$terraform
╰─$character"""

right_format = "$cmd_duration$status"

palette = "catppuccin_mocha"
add_newline = true

[username]
show_always = true
style_user = "green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "green"
format = "[$hostname]($style)"

[directory]
style = "bold blue"
truncation_length = 8        # gnzh shows the (near-)full ~-relative path
truncate_to_repo = false
format = "[$path]($style)"
read_only = " 󰌾"

[git_branch]
symbol = ""
style = "yellow"
format = " [‹$branch]($style)"

# Renders the closing › even when clean, completing git_branch's ‹.
[git_status]
style = "yellow"
format = "[$all_status$ahead_behind›]($style)"

# ── Client profile indicator (reads $DEV_PROFILE set by `profile`) ────────────
[custom.profile]
command = 'printf "%s" "${HATS_PROFILE:-${DEV_PROFILE:-normal}}"'
when = true
shell = ["sh", "--norc"]
description = "active client profile"
format = " [󱃖 $output]($style)"
style = "mauve"

[character]
success_symbol = "[➤](bold green)"
error_symbol = "[➤](bold red)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
min_time = 500
style = "subtext0"
format = "[󱎫 $duration]($style) "

# gnzh's RPROMPT: last exit code in red, e.g. `1 ↵`
[status]
disabled = false
style = "red"
format = "[$status ↵]($style)"

# ── Kubernetes: context + namespace, prod coloured red ────────────────────────
[kubernetes]
disabled = false
symbol = "☸ "
style = "blue"
format = ' [$symbol$context( \($namespace\))]($style)'

# Shorten long EKS ARNs; add your real cluster ARNs here.
[kubernetes.context_aliases]
"arn:aws:eks:.*:.*:cluster/(.*)" = "$1"
"gke_.*_(.*)" = "$1"

# Style rules: anything matching prod goes bold red as a wrong-window guard.
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"
symbol = "🚨 ☸ "

[[kubernetes.contexts]]
context_pattern = ".*(staging|stage|uat).*"
style = "yellow"

[[kubernetes.contexts]]
context_pattern = ".*(dev|develop|sandbox|local|kind|minikube).*"
style = "green"

# ── AWS: profile + region (only shows when creds detected) ────────────────────
[aws]
symbol = " "
style = "peach"
format = ' [$symbol$profile(\($region\))]($style)'
[aws.region_aliases]
eu-west-1 = "euw1"
eu-west-2 = "euw2"
us-east-1 = "use1"

# ── Terraform / OpenTofu: workspace ───────────────────────────────────────────
[terraform]
symbol = "󱁢 "
style = "lavender"
format = ' [$symbol$workspace]($style)'

# ── Catppuccin Mocha palette ──────────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
